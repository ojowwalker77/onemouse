[package]
name = "onemouse-transport"
description = "Encrypted, mutually authenticated transport for onemouse: Noise XX, pairing, pinned keys, mDNS discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake2 = "0.10.6"
getrandom = "0.3.4"
mdns-sd = "0.21.5"
onemouse-protocol.workspace = true
# Only the primitives we use (pure Rust). snow's `std` feature would pull in
# `ring` unconditionally.
snow = { version = "0.10.0", default-features = false, features = [
    "default-resolver",
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }
subtle = "2.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
