[package]
name = "onemouse-transport"
description = "Encrypted, mutually authenticated transport for onemouse: Noise XX, pairing, pinned keys, mDNS discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
onemouse-protocol.workspace = true
mdns-sd = "0.21.5"
# Only the primitives we use (pure Rust). snow's `std` feature would pull in
# `ring` unconditionally.
snow = { version = "0.10.0", default-features = false, features = [
    "default-resolver",
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }

[dev-dependencies]
tempfile = "3"
